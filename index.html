<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Economics Diagrams</title>
<link rel="stylesheet" href="ew.css">
<style>
/* Index page only. Everything is scoped to #menu / body:not(.in-widget) so the widget pages are untouched. */
:root { --blue: #1556b8; --red: #d62d1a; --line: #2a2a2a; }

/* Very faint graph-paper grid behind the index (the widget pages keep the plain background). */
body:not(.in-widget) {
  background-image:
    linear-gradient(rgba(21, 86, 184, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21, 86, 184, .07) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ew.css sets display on #app, which overrides the hidden attribute and showed the widget header under the index. */
#app[hidden] { display: none; }

/* One font on the index only (widget pages keep the fonts set in ew.css). */
#menu { --serif: Georgia, 'Noto Serif', 'Times New Roman', Times, serif; --sans: var(--serif); font-family: var(--serif); max-width: 720px; padding: 0 16px 56px; }

/* Header and jump bar stay frozen at the top while the page scrolls. */
.top { position: sticky; top: 0; z-index: 5; margin: 0 -16px; padding: 12px 16px 0; background: var(--bg); }
.site-head { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#menu .site-head h1 { font: 400 28px/1.15 var(--serif); color: var(--ink); margin: 0; }
.head-diagram { flex: none; width: 150px; height: 112px; }
.head-diagram .axis { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.head-diagram .curve { fill: none; stroke-width: 3.5; stroke-dasharray: 1 1; stroke-dashoffset: 0; animation: draw 4s ease-in-out both; }
.head-diagram .d { stroke: var(--blue); }
.head-diagram .s { stroke: var(--red); }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* "Jump to" bar */
#topic-bar { display: flex; flex-wrap: wrap; align-items: center; margin: 0 -16px; padding: 0 12px; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#topic-bar .label { padding: 0 4px 0 7px; font-size: 15px; color: var(--muted); white-space: nowrap; }
#topic-bar a { position: relative; display: inline-flex; align-items: center; min-height: 44px; padding: 0 7px; font-size: 15px; color: var(--blue); text-decoration: none; white-space: nowrap; }
#topic-bar a:not(:last-child)::after { content: "\00b7"; position: absolute; right: -3px; color: var(--muted); }
#topic-bar a:hover { text-decoration: underline; }
#topic-bar a:active { color: var(--red); }

/* Categories and topics */
.cat { scroll-margin-top: calc(var(--top-h, 200px) + 4px); padding-top: 22px; }
#menu .cat-title { font: 700 22px/1.2 var(--serif); color: var(--ink); margin: 0 0 4px; padding: 0 0 6px; border: 0; border-bottom: 3px solid var(--ink); }
.tp summary { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 4px; cursor: pointer; list-style: none; font: 400 17px/1.3 var(--serif); }
.tp summary::-webkit-details-marker { display: none; }
.tp summary:hover .tname { text-decoration: underline; text-underline-offset: 3px; }
.tp summary:focus-visible, .row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.arrow { flex: none; width: 0; height: 0; border-style: solid; border-width: 6px 0 6px 9px; border-color: transparent transparent transparent var(--blue); transition: transform .2s ease; }
.tp.is-open .arrow { transform: rotate(90deg); border-left-color: var(--red); }
.count { font-weight: 400; color: var(--muted); font-family: var(--sans); font-size: 15px; }
.pending { margin: 0; padding: 12px 4px; color: var(--muted); }

/* Widget rows */
#menu .rows { overflow: hidden; margin: 0; padding: 0; }
#menu .rows li { padding: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 6px 4px 6px 25px; font-size: 16px; line-height: 1.3; color: var(--blue); text-decoration: none; }
.row:hover .rname { text-decoration: underline; text-underline-offset: 3px; }
.row:active { color: var(--red); }
.row .tag { font-weight: 400; color: var(--red); border-color: var(--red); }

@media (max-width: 719px) {
  #topic-bar .label, #topic-bar a { font-size: 13px; }
  #topic-bar .label { padding: 0 2px 0 4px; }
  #topic-bar a { padding: 0 4px; }
  #topic-bar a:not(:last-child)::after { right: -2px; }
}

@media (min-width: 720px) {
  .top { margin: 0; padding: 32px 0 0; }
  #menu .site-head h1 { font-size: 34px; }
  .head-diagram { width: 220px; height: 165px; }
  #topic-bar { margin: 0; padding: 0; }
  #topic-bar .label { padding: 0 14px 0 0; }
  #topic-bar a { padding: 0 14px 0 0; margin-right: 14px; }
  #topic-bar a:not(:last-child)::after { right: -4px; }
}

@media (prefers-reduced-motion: reduce) {
  .head-diagram .curve { animation: none; }
  .arrow { transition: none; }
}
</style>
</head>
<body>

<main id="menu">
  <div class="top">
  <header class="site-head">
    <h1>Economics Diagrams</h1>
    <svg class="head-diagram" viewBox="0 0 120 90" aria-hidden="true" focusable="false">
      <path class="axis" d="M12 6V78H114"/>
      <path class="curve d" pathLength="1" d="M20 14Q48 54 106 72"/>
      <path class="curve s" pathLength="1" d="M20 72Q62 60 106 12"/>
    </svg>
  </header>
  <nav id="topic-bar" aria-label="Jump to"></nav>
  </div>
  <!-- ew.js requires this element when it starts; it is never shown. -->
  <input type="search" id="menu-search" hidden aria-hidden="true" tabindex="-1">
  <div id="menu-list"></div>
</main>

<div id="app" hidden>
  <header id="bar">
    <a href="#" class="home">All topics</a>
    <h1 id="w-title"></h1>
    <span id="w-guided" class="tag" hidden>Guided</span>
    <button id="glossary-btn" type="button" aria-pressed="false">Glossary</button>
  </header>

  <div id="stage">
    <svg id="diagram" viewBox="0 0 600 520" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title"></title><desc id="diagram-desc"></desc>
    </svg>
    <div id="tip" role="note" hidden></div>
  </div>

  <aside id="panel">
    <div id="panel-main">
      <section id="stepper" hidden aria-live="polite">
        <p id="step-count"></p>
        <h2 id="step-title"></h2>
        <div id="step-text"></div>
        <div class="step-nav"><button id="step-back" type="button">Back</button><button id="step-next" type="button">Next</button></div>
        <p id="step-msg" role="status"></p>
      </section>
      <section class="side-section" id="controls-section">
        <h2 class="side-head">Controls</h2>
        <div id="controls"></div>
        <label class="check"><input type="checkbox" id="c-tips"> Tooltips</label>
      </section>
      <section class="side-section" id="result-section" hidden>
        <h2 class="side-head">Summary</h2>
        <div id="result" aria-live="polite"></div>
      </section>
      <section class="side-section" id="notes-section" hidden>
        <h2 class="side-head">Price Adjustment Process</h2>
        <div id="notes"></div>
      </section>
      <div class="actions">
        <button id="reset" type="button">Reset</button>
        <details class="save">
          <summary>Save diagram</summary>
          <fieldset class="radio"><legend>Image style</legend>
            <label><input type="radio" name="img-style" value="colour" checked> Colour</label>
            <label><input type="radio" name="img-style" value="grey"> Greyscale (for printing)</label>
          </fieldset>
          <button id="download" type="button">Download PNG</button>
          <button id="copy" type="button">Copy</button>
          <p id="save-status" role="status"></p>
        </details>
      </div>
    </div>
    <section id="glossary" hidden>
      <div class="glossary-head"><h2>Glossary</h2><button id="glossary-close" type="button">Back to diagram controls</button></div>
      <div id="glossary-list"></div>
    </section>
  </aside>
</div>

<script src="ew.js"></script>
<script src="glossary.js"></script>
<script src="tips.js"></script>
<script src="topics/demand-supply.js"></script>
<script src="topics/elasticities.js"></script>
<script src="topics/ppc.js"></script>
<script src="topics/government-intervention.js"></script>
<script src="topics/externalities.js"></script>
<script src="topics/market-failure-info.js"></script>
<script src="topics/macro.js"></script>
<script src="topics/firms-costs.js"></script>
<script src="topics/firms-revenue.js"></script>
<script src="topics/firms-profit.js"></script>
<script>
// Widget list (unchanged from the previous index). Entries ending in .html are older pages not yet moved onto the shared engine.
const MENU = [
  ['Topic 1: Scarcity, Choice and Opportunity Cost', [
    ['ppc', 'Production Possibility Curve (PPC)']]],
  ['Topic 2: Demand and Supply', [
    ['ds-guided', 'Price Adjustment Process', true],
    ['ds-single', 'Demand and Supply: Single Shift'],
    ['ds-simultaneous', 'Demand and Supply: Simultaneous Shifts']]],
  ['Topic 3: Elasticities', [
    ['ped', 'Price Elasticity of Demand (PED)'],
    ['pes', 'Price Elasticity of Supply (PES)'],
    ['xed', 'Cross Elasticity of Demand (XED)'],
    ['yed', 'Income Elasticity of Demand (YED)']]],
  ['Topic 4: Government Intervention', [
    ['government-intervention', 'Government Intervention in Markets']]],
  ['Topic 5: Market Failure', [
    ['guided-externalities', 'Externalities as a Source of Market Failure', true],
    ['negative-externalities', 'Negative Externalities'],
    ['ne-measures', 'Government Measures: Negative Externalities'],
    ['positive-externalities', 'Positive Externalities'],
    ['pe-measures', 'Government Measures: Positive Externalities'],
    ['guided-imperfect-information', 'Imperfect Information as a Source of Market Failure', true],
    ['imperfect-information', 'Imperfect Information'],
    ['imperfect-information-measures', 'Government Measures: Imperfect Information']]],
  ['Topic 7: Introduction to the Macroeconomy', [
    ['ad-factors', 'Factors Affecting Aggregate Demand'],
    ['as-factors', 'Factors Affecting Aggregate Supply'],
    ['ad-as', 'AD–AS Equilibrium']]],
  ['Topic 8: Macroeconomic Issues and Causes', [
    ['macro-issues', 'Macroeconomic Issues and Their Causes']]],
  ['Topic 9: Macroeconomic Policy', [
    ['fiscal-policy', 'Fiscal Policy'],
    ['monetary-policy', 'Monetary Policy (Interest and Exchange Rates)'],
    ['supply-side-policy', 'Supply-Side Policies']]],
  ['Topic 11: Firms and Decisions', [
    ['sr-costs', 'Short-Run Costs'],
    ['scale-economies', 'Economies and Diseconomies of Scale'],
    ['revenue-curves', 'Revenue Curves and Market Power'],
    ['profit-max', 'Profit Maximisation'],
    ['profit-guided', 'Draw the Profit Diagram', true]]],
];

// ew.js builds the menu, widget routing and everything on the widget pages.
EW.start(MENU);

// The index layout below replaces the menu ew.js just built. Topics 6 and 10 are not listed here, so they are never shown.
// [jump-bar label, section heading, topic numbers]
const CATS = [['General', 'General', [1]], ['Micro', 'Microeconomics', [2, 3, 4, 5]], ['Macro', 'Macroeconomics', [7, 8, 9]], ['Firms & Decisions', 'Firms & Decisions', [11]]];
const SLUGS = ['general', 'micro', 'macro', 'firms'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const topicNo = t => +(t.match(/^Topic (\d+)/)?.[1]);
const link = ref => ref.endsWith('.html') ? ref : '#' + ref;   // same rule as ew.js
const byNo = new Map(MENU.map(t => [topicNo(t[0]), t]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

document.getElementById('menu-list').innerHTML = CATS.map(([, cat, nos], i) =>
  `<section class="cat" id="cat-${SLUGS[i]}"><h2 class="cat-title">${esc(cat)}</h2>` + nos.map(n => {
    const t = byNo.get(n);
    if (!t) return `<p class="pending">Topic ${n} coming soon.</p>`;
    return `<details class="tp"><summary><span class="arrow" aria-hidden="true"></span><span><span class="tname">${esc(t[0])}</span> <span class="count">(${t[1].length})</span></span></summary>` +
      `<ul class="rows">${t[1].map(([ref, name, guided]) =>
        `<li><a class="row" href="${esc(link(ref))}"><span class="rname">${esc(name)}</span>${guided ? '<span class="tag">Guided</span>' : ''}</a></li>`).join('')}</ul></details>`;
  }).join('') + '</section>').join('');

// Jump bar: scrolls without touching the URL hash (the hash is the widget route).
const jump = document.getElementById('topic-bar');
jump.innerHTML = '<span class="label">Jump to:</span>' + CATS.map(([short], i) => `<a href="#cat-${SLUGS[i]}">${esc(short)}</a>`).join('');
jump.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
});

// Jump targets stop below the frozen header and jump bar.
const topBlock = document.querySelector('.top');
new ResizeObserver(() => document.getElementById('menu').style.setProperty('--top-h', topBlock.offsetHeight + 'px')).observe(topBlock);

// Toggles: <details> keeps tap and keyboard behaviour; the list height is animated on top of it.
document.querySelectorAll('#menu-list details.tp').forEach(d => {
  const panel = d.querySelector('.rows');
  d.querySelector('summary').addEventListener('click', e => {
    e.preventDefault();
    const opening = !d.classList.contains('is-open');
    d.classList.toggle('is-open', opening);
    d._anim?.cancel();
    if (opening) d.open = true;
    if (reduceMotion.matches) { d.open = opening; return; }
    const h = panel.scrollHeight + 'px';
    const anim = panel.animate({ height: opening ? ['0px', h] : [h, '0px'] }, { duration: 220, easing: 'ease' });
    d._anim = anim;
    anim.onfinish = () => { if (!opening) d.open = false; d._anim = null; };
  });
});

// ew.js sets the tab title to "Economics diagrams"; use the capitalised form after every route change.
const fixTitle = () => { document.title = document.title.replace('Economics diagrams', 'Economics Diagrams'); };
fixTitle();
addEventListener('hashchange', fixTitle);
</script>
</body>
</html>
